<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>暗色计时器 · 清晰版</title>

    <style>
        /* ============================================================
                   全局重置 & 暗色主题 (提升对比度)
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a0e;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(40, 60, 100, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(60, 40, 120, 0.10) 0%, transparent 60%);
            padding: 1.5rem;
        }

        /* ============================================================
                   计时器卡片 (更亮一些，有层次)
                   ============================================================ */
        .timer-card {
            width: 100%;
            max-width: 520px;
            background: rgba(18, 18, 26, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 2.8rem 2.4rem 2.4rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            position: relative;
            overflow: hidden;
        }

        .timer-card::before {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(80, 160, 255, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .timer-card::after {
            content: '';
            position: absolute;
            bottom: -80px;
            left: -80px;
            width: 240px;
            height: 240px;
            background: radial-gradient(circle, rgba(140, 80, 255, 0.04) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        /* ============================================================
                   标题 (更亮)
                   ============================================================ */
        .timer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2.2rem;
            position: relative;
            z-index: 1;
        }

        .timer-header .label {
            font-weight: 300;
            font-size: 0.8rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.35);
        }

        .timer-header .status {
            font-weight: 300;
            font-size: 0.65rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.03);
            padding: 0.2rem 1rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .timer-header .status.active {
            color: rgba(80, 200, 255, 0.7);
            border-color: rgba(80, 200, 255, 0.10);
        }

        /* ============================================================
                   时间显示 (亮白)
                   ============================================================ */
        .timer-display {
            text-align: center;
            padding: 0.4rem 0 1.2rem;
            position: relative;
            z-index: 1;
        }

        .timer-display .time {
            font-weight: 200;
            font-size: 5.2rem;
            letter-spacing: 4px;
            color: #f0f4f8;
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
            text-shadow: 0 0 80px rgba(100, 180, 255, 0.04);
        }

        .timer-display .time .millis {
            font-size: 2.4rem;
            font-weight: 200;
            color: rgba(255, 255, 255, 0.35);
            margin-left: 0.1rem;
            letter-spacing: 1px;
        }

        .timer-display .time .separator {
            color: rgba(255, 255, 255, 0.12);
            font-weight: 100;
            margin: 0 0.05rem;
        }

        /* ============================================================
                   进度条 (更明显)
                   ============================================================ */
        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            margin: 0.8rem 0 1.8rem;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, rgba(80, 180, 255, 0.5), rgba(160, 100, 255, 0.4));
            border-radius: 4px;
            transition: width 0.15s linear;
        }

        /* ============================================================
                   控制按钮 (高对比度)
                   ============================================================ */
        .controls {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }

        .btn {
            font-family: inherit;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 0.8rem 2.4rem;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            min-width: 120px;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 60px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.04), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .btn:hover::after {
            opacity: 1;
        }

        .btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.10);
            color: rgba(255, 255, 255, 0.9);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: rgba(60, 160, 255, 0.10);
            border-color: rgba(60, 160, 255, 0.12);
            color: rgba(60, 160, 255, 0.8);
        }

        .btn-primary:hover {
            background: rgba(60, 160, 255, 0.16);
            border-color: rgba(60, 160, 255, 0.20);
            color: #8ac4ff;
        }

        .btn-primary.active {
            background: rgba(255, 80, 80, 0.10);
            border-color: rgba(255, 80, 80, 0.12);
            color: rgba(255, 80, 80, 0.8);
        }

        .btn-primary.active:hover {
            background: rgba(255, 80, 80, 0.16);
            border-color: rgba(255, 80, 80, 0.20);
            color: #ff8a8a;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.5);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.8);
        }

        /* ============================================================
                   计次列表 (清晰可见)
                   ============================================================ */
        .laps-container {
            margin-top: 1.8rem;
            max-height: 150px;
            overflow-y: auto;
            position: relative;
            z-index: 1;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.06) transparent;
        }

        .laps-container::-webkit-scrollbar {
            width: 3px;
        }

        .laps-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .laps-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }

        .laps-list {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            padding: 0 0.2rem;
        }

        .lap-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            transition: color 0.3s ease;
        }

        .lap-item .lap-num {
            font-weight: 300;
            color: rgba(255, 255, 255, 0.25);
        }

        .lap-item .lap-time {
            font-weight: 300;
            font-variant-numeric: tabular-nums;
            color: rgba(255, 255, 255, 0.55);
        }

        .lap-item:first-child {
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        .laps-empty {
            text-align: center;
            color: rgba(255, 255, 255, 0.10);
            font-size: 0.7rem;
            letter-spacing: 3px;
            padding: 0.8rem 0;
            text-transform: uppercase;
        }

        /* ============================================================
                   响应式
                   ============================================================ */
        @media (max-width: 480px) {
            .timer-card {
                padding: 2rem 1.2rem 1.8rem;
                border-radius: 32px;
            }

            .timer-display .time {
                font-size: 3.6rem;
                letter-spacing: 2px;
            }

            .timer-display .time .millis {
                font-size: 1.6rem;
            }

            .btn {
                padding: 0.6rem 1.4rem;
                font-size: 0.8rem;
                min-width: 90px;
            }

            .controls {
                gap: 0.8rem;
            }

            .timer-header .label {
                font-size: 0.65rem;
                letter-spacing: 4px;
            }

            .timer-header .status {
                font-size: 0.55rem;
                padding: 0.15rem 0.7rem;
            }
        }

        @media (max-width: 380px) {
            .timer-display .time {
                font-size: 2.8rem;
            }

            .timer-display .time .millis {
                font-size: 1.2rem;
            }

            .btn {
                padding: 0.5rem 1rem;
                font-size: 0.7rem;
                min-width: 70px;
            }
        }
    </style>
</head>
<body>

    <div class="timer-card">
        <!-- 头部 -->
        <div class="timer-header">
            <span class="label">⏱ 计时器</span>
            <span class="status" id="statusText">● 待命</span>
        </div>

        <!-- 时间显示 -->
        <div class="timer-display">
            <div class="time" id="display">
                <span id="hours">00</span>
                <span class="separator">:</span>
                <span id="minutes">00</span>
                <span class="separator">:</span>
                <span id="seconds">00</span>
                <span class="millis">.<span id="millis">00</span></span>
            </div>
        </div>

        <!-- 进度条 -->
        <div class="progress-bar">
            <div class="fill" id="progressFill"></div>
        </div>

        <!-- 控制按钮 -->
        <div class="controls">
            <button class="btn btn-primary" id="btnStart">▶ 开始</button>
            <button class="btn btn-secondary" id="btnLap">◈ 计次</button>
            <button class="btn btn-secondary" id="btnReset">↺ 重置</button>
        </div>

        <!-- 计次列表 -->
        <div class="laps-container">
            <div class="laps-list" id="lapsList">
                <div class="laps-empty">— 暂无计次 —</div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // DOM 引用
            // ============================================================
            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('seconds');
            const millisEl = document.getElementById('millis');
            const statusText = document.getElementById('statusText');
            const progressFill = document.getElementById('progressFill');
            const btnStart = document.getElementById('btnStart');
            const btnLap = document.getElementById('btnLap');
            const btnReset = document.getElementById('btnReset');
            const lapsList = document.getElementById('lapsList');

            // ============================================================
            // 计时器状态
            // ============================================================
            let startTime = 0;
            let elapsed = 0; // 毫秒
            let running = false;
            let animFrame = null;
            let lastTimestamp = 0;
            let laps = [];
            let lapStart = 0;

            // ============================================================
            // 格式化时间
            // ============================================================
            function formatTime(ms) {
                const totalSec = Math.floor(ms / 1000);
                const h = Math.floor(totalSec / 3600);
                const m = Math.floor((totalSec % 3600) / 60);
                const s = totalSec % 60;
                const mill = Math.floor((ms % 1000) / 10);
                return {
                    h: String(h).padStart(2, '0'),
                    m: String(m).padStart(2, '0'),
                    s: String(s).padStart(2, '0'),
                    ms: String(mill).padStart(2, '0')
                };
            }

            function updateDisplay(ms) {
                const t = formatTime(ms);
                hoursEl.textContent = t.h;
                minutesEl.textContent = t.m;
                secondsEl.textContent = t.s;
                millisEl.textContent = t.ms;
            }

            // ============================================================
            // 进度条
            // ============================================================
            function updateProgress(ms) {
                if (running) {
                    const val = (ms % 5000) / 5000;
                    progressFill.style.width = (val * 100) + '%';
                } else {
                    // 暂停时保持
                }
            }

            // ============================================================
            // 状态更新
            // ============================================================
            function setStatus(text, active = false) {
                statusText.textContent = text;
                if (active) {
                    statusText.classList.add('active');
                } else {
                    statusText.classList.remove('active');
                }
            }

            // ============================================================
            // 计次列表
            // ============================================================
            function renderLaps() {
                if (laps.length === 0) {
                    lapsList.innerHTML = '<div class="laps-empty">— 暂无计次 —</div>';
                    return;
                }

                let html = '';
                const reversed = [...laps].reverse();
                reversed.forEach((lap, idx) => {
                    const num = laps.length - idx;
                    const t = formatTime(lap);
                    html += `
                        <div class="lap-item">
                            <span class="lap-num">#${String(num).padStart(2, '0')}</span>
                            <span class="lap-time">${t.h}:${t.m}:${t.s}.${t.ms}</span>
                        </div>
                    `;
                });
                lapsList.innerHTML = html;
            }

            // ============================================================
            // 核心计时循环
            // ============================================================
            function tick(timestamp) {
                if (!running) return;

                if (lastTimestamp === 0) {
                    lastTimestamp = timestamp;
                    animFrame = requestAnimationFrame(tick);
                    return;
                }

                const delta = timestamp - lastTimestamp;
                lastTimestamp = timestamp;

                const step = Math.min(delta, 100);
                elapsed += step;

                updateDisplay(elapsed);
                updateProgress(elapsed);

                animFrame = requestAnimationFrame(tick);
            }

            // ============================================================
            // 控制函数
            // ============================================================
            function startTimer() {
                if (running) return;

                if (elapsed === 0) {
                    setStatus('● 运行中', true);
                } else {
                    setStatus('● 继续', true);
                }

                running = true;
                lastTimestamp = 0;
                btnStart.textContent = '⏸ 暂停';
                btnStart.classList.add('active');

                if (elapsed === 0) {
                    lapStart = 0;
                }

                animFrame = requestAnimationFrame(tick);
            }

            function pauseTimer() {
                if (!running) return;
                running = false;
                if (animFrame) {
                    cancelAnimationFrame(animFrame);
                    animFrame = null;
                }
                btnStart.textContent = '▶ 继续';
                btnStart.classList.remove('active');
                setStatus('● 已暂停', false);
            }

            function toggleTimer() {
                if (running) {
                    pauseTimer();
                } else {
                    startTimer();
                }
            }

            function resetTimer() {
                if (running) {
                    running = false;
                    if (animFrame) {
                        cancelAnimationFrame(animFrame);
                        animFrame = null;
                    }
                }

                elapsed = 0;
                lapStart = 0;
                laps = [];
                updateDisplay(0);
                progressFill.style.width = '0%';
                btnStart.textContent = '▶ 开始';
                btnStart.classList.remove('active');
                setStatus('● 待命', false);
                renderLaps();
            }

            function addLap() {
                if (!running && elapsed === 0) return;
                if (elapsed === 0) return;

                laps.push(elapsed);
                renderLaps();

                const container = lapsList.parentElement;
                if (container) {
                    container.scrollTop = 0;
                }
            }

            // ============================================================
            // 键盘快捷键
            // ============================================================
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

                if (e.code === 'Space') {
                    e.preventDefault();
                    toggleTimer();
                }
                if (e.code === 'KeyR') {
                    resetTimer();
                }
                if (e.code === 'KeyL') {
                    addLap();
                }
            });

            // ============================================================
            // 绑定事件
            // ============================================================
            btnStart.addEventListener('click', toggleTimer);
            btnLap.addEventListener('click', addLap);
            btnReset.addEventListener('click', resetTimer);

            // ============================================================
            // 初始化
            // ============================================================
            updateDisplay(0);
            progressFill.style.width = '0%';
            setStatus('● 待命', false);
            renderLaps();

            console.log('⏱ 暗色计时器 (清晰版) 已启动');
            console.log('⌨️ 空格: 开始/暂停  |  R: 重置  |  L: 计次');

        })();
    </script>

</body>
</html>
