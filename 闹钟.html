<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>暗色闹钟</title>

    <style>
        /* ============================================================
                   全局重置 & 暗色主题 (高对比度)
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a0e;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(40, 60, 100, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(60, 40, 120, 0.08) 0%, transparent 60%);
            padding: 1.5rem;
        }

        /* ============================================================
                   闹钟卡片
                   ============================================================ */
        .alarm-card {
            width: 100%;
            max-width: 520px;
            background: rgba(18, 18, 26, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 2.8rem 2.4rem 2.4rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            position: relative;
            overflow: hidden;
        }

        .alarm-card::before {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255, 180, 60, 0.04) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .alarm-card::after {
            content: '';
            position: absolute;
            bottom: -80px;
            left: -80px;
            width: 240px;
            height: 240px;
            background: radial-gradient(circle, rgba(255, 100, 80, 0.03) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        /* ============================================================
                   头部
                   ============================================================ */
        .alarm-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2.0rem;
            position: relative;
            z-index: 1;
        }

        .alarm-header .label {
            font-weight: 300;
            font-size: 0.8rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.35);
        }

        .alarm-header .status {
            font-weight: 300;
            font-size: 0.65rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.03);
            padding: 0.2rem 1rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
        }

        .alarm-header .status.active {
            color: rgba(255, 200, 80, 0.8);
            border-color: rgba(255, 200, 80, 0.15);
        }

        .alarm-header .status.ringing {
            color: rgba(255, 80, 80, 0.9);
            border-color: rgba(255, 80, 80, 0.20);
            animation: pulse-status 1s infinite;
        }

        @keyframes pulse-status {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ============================================================
                   当前时间显示
                   ============================================================ */
        .current-time {
            text-align: center;
            padding: 0.4rem 0 1.2rem;
            position: relative;
            z-index: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            margin-bottom: 1.2rem;
        }

        .current-time .time {
            font-weight: 200;
            font-size: 4.2rem;
            letter-spacing: 4px;
            color: #f0f4f8;
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
            text-shadow: 0 0 80px rgba(100, 180, 255, 0.03);
        }

        .current-time .time .seconds {
            font-size: 2.0rem;
            font-weight: 200;
            color: rgba(255, 255, 255, 0.25);
            margin-left: 0.1rem;
            letter-spacing: 1px;
        }

        .current-time .time .separator {
            color: rgba(255, 255, 255, 0.08);
            font-weight: 100;
            margin: 0 0.05rem;
        }

        .current-time .date {
            font-weight: 300;
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.12);
            margin-top: 0.4rem;
        }

        /* ============================================================
                   闹钟设置区
                   ============================================================ */
        .alarm-setup {
            display: flex;
            flex-direction: column;
            gap: 1.0rem;
            margin: 1.2rem 0 1.8rem;
            position: relative;
            z-index: 1;
        }

        .alarm-setup .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .alarm-setup .label-row .alarm-status {
            font-weight: 400;
            color: rgba(255, 255, 255, 0.2);
        }

        .alarm-setup .label-row .alarm-status.on {
            color: rgba(80, 200, 255, 0.6);
        }

        .time-picker {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.2rem;
            background: rgba(255, 255, 255, 0.02);
            padding: 0.8rem 1.2rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .time-picker .picker-group {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .time-picker .picker-group label {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .time-picker .picker-group input {
            width: 60px;
            padding: 0.4rem 0.2rem;
            text-align: center;
            font-size: 1.6rem;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.06);
            color: #f0f4f8;
            outline: none;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }

        .time-picker .picker-group input:focus {
            border-color: rgba(80, 180, 255, 0.3);
        }

        .time-picker .picker-group input::-webkit-outer-spin-button,
        .time-picker .picker-group input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .time-picker .picker-group input[type=number] {
            -moz-appearance: textfield;
        }

        .time-picker .picker-group .colon {
            color: rgba(255, 255, 255, 0.08);
            font-size: 1.8rem;
            font-weight: 100;
            padding: 0 0.1rem;
        }

        /* ============================================================
                   控制按钮
                   ============================================================ */
        .controls {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
            margin-top: 0.4rem;
        }

        .btn {
            font-family: inherit;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 0.8rem 2.4rem;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            min-width: 120px;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 60px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.04), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .btn:hover::after {
            opacity: 1;
        }

        .btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.10);
            color: rgba(255, 255, 255, 0.9);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: rgba(60, 160, 255, 0.10);
            border-color: rgba(60, 160, 255, 0.12);
            color: rgba(60, 160, 255, 0.8);
        }

        .btn-primary:hover {
            background: rgba(60, 160, 255, 0.16);
            border-color: rgba(60, 160, 255, 0.20);
            color: #8ac4ff;
        }

        .btn-primary.active {
            background: rgba(255, 80, 80, 0.10);
            border-color: rgba(255, 80, 80, 0.12);
            color: rgba(255, 80, 80, 0.8);
        }

        .btn-primary.active:hover {
            background: rgba(255, 80, 80, 0.16);
            border-color: rgba(255, 80, 80, 0.20);
            color: #ff8a8a;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.5);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.8);
        }

        /* ============================================================
                   响铃提示 (覆盖层)
                   ============================================================ */
        .ringing-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 1.5rem;
            animation: fade-in 0.5s ease;
        }

        .ringing-overlay.show {
            display: flex;
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .ringing-overlay .ring-icon {
            font-size: 6rem;
            animation: ring-bell 0.8s infinite alternate;
        }

        @keyframes ring-bell {
            0% { transform: rotate(-15deg); }
            100% { transform: rotate(15deg); }
        }

        .ringing-overlay .ring-text {
            font-size: 2.2rem;
            font-weight: 200;
            color: #f0f4f8;
            letter-spacing: 4px;
        }

        .ringing-overlay .ring-sub {
            font-size: 1.0rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
        }

        .ringing-overlay .btn-stop {
            margin-top: 0.5rem;
            padding: 0.8rem 3rem;
            border-radius: 60px;
            background: rgba(255, 80, 80, 0.12);
            border: 1px solid rgba(255, 80, 80, 0.15);
            color: rgba(255, 80, 80, 0.8);
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            backdrop-filter: blur(4px);
        }

        .ringing-overlay .btn-stop:hover {
            background: rgba(255, 80, 80, 0.20);
            border-color: rgba(255, 80, 80, 0.25);
            transform: scale(1.02);
        }

        /* ============================================================
                   响应式
                   ============================================================ */
        @media (max-width: 480px) {
            .alarm-card {
                padding: 2rem 1.2rem 1.8rem;
                border-radius: 32px;
            }

            .current-time .time {
                font-size: 3.2rem;
            }

            .current-time .time .seconds {
                font-size: 1.6rem;
            }

            .time-picker {
                flex-direction: column;
                gap: 0.6rem;
                padding: 0.8rem 0.6rem;
            }

            .time-picker .picker-group input {
                width: 50px;
                font-size: 1.4rem;
            }

            .btn {
                padding: 0.6rem 1.4rem;
                font-size: 0.8rem;
                min-width: 90px;
            }

            .controls {
                gap: 0.8rem;
            }

            .alarm-header .label {
                font-size: 0.65rem;
                letter-spacing: 4px;
            }

            .alarm-header .status {
                font-size: 0.55rem;
                padding: 0.15rem 0.7rem;
            }

            .ringing-overlay .ring-icon {
                font-size: 4rem;
            }
            .ringing-overlay .ring-text {
                font-size: 1.6rem;
            }
        }

        @media (max-width: 380px) {
            .current-time .time {
                font-size: 2.6rem;
            }
            .current-time .time .seconds {
                font-size: 1.2rem;
            }
            .time-picker .picker-group input {
                width: 40px;
                font-size: 1.2rem;
            }
            .btn {
                padding: 0.5rem 1rem;
                font-size: 0.7rem;
                min-width: 70px;
            }
        }
    </style>
</head>
<body>

    <div class="alarm-card">
        <!-- 头部 -->
        <div class="alarm-header">
            <span class="label">⏰ 闹钟</span>
            <span class="status" id="statusText">● 待命</span>
        </div>

        <!-- 当前时间 -->
        <div class="current-time">
            <div class="time" id="currentDisplay">
                <span id="curH">00</span>
                <span class="separator">:</span>
                <span id="curM">00</span>
                <span class="separator">:</span>
                <span id="curS">00</span>
                <span class="seconds">.<span id="curMs">00</span></span>
            </div>
            <div class="date" id="dateDisplay">----年--月--日 周-</div>
        </div>

        <!-- 闹钟设置 -->
        <div class="alarm-setup">
            <div class="label-row">
                <span>设定闹钟</span>
                <span class="alarm-status" id="alarmStatus">● 关闭</span>
            </div>
            <div class="time-picker">
                <div class="picker-group">
                    <label>时</label>
                    <input type="number" id="alarmHour" min="0" max="23" value="7" />
                </div>
                <span class="colon">:</span>
                <div class="picker-group">
                    <label>分</label>
                    <input type="number" id="alarmMinute" min="0" max="59" value="30" />
                </div>
            </div>
        </div>

        <!-- 控制按钮 -->
        <div class="controls">
            <button class="btn btn-primary" id="btnSet">🔔 设定</button>
            <button class="btn btn-secondary" id="btnCancel">✕ 取消</button>
        </div>
    </div>

    <!-- 响铃覆盖层 -->
    <div class="ringing-overlay" id="ringingOverlay">
        <div class="ring-icon">🔔</div>
        <div class="ring-text">⏰ 闹钟响铃！</div>
        <div class="ring-sub" id="ringTime">07:30</div>
        <button class="btn-stop" id="btnStopRing">停止</button>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // DOM 引用
            // ============================================================
            const curH = document.getElementById('curH');
            const curM = document.getElementById('curM');
            const curS = document.getElementById('curS');
            const curMs = document.getElementById('curMs');
            const dateDisplay = document.getElementById('dateDisplay');
            const statusText = document.getElementById('statusText');
            const alarmStatus = document.getElementById('alarmStatus');
            const alarmHour = document.getElementById('alarmHour');
            const alarmMinute = document.getElementById('alarmMinute');
            const btnSet = document.getElementById('btnSet');
            const btnCancel = document.getElementById('btnCancel');
            const ringingOverlay = document.getElementById('ringingOverlay');
            const btnStopRing = document.getElementById('btnStopRing');
            const ringTime = document.getElementById('ringTime');

            // ============================================================
            // 状态
            // ============================================================
            let alarmActive = false;
            let alarmTime = { h: 7, m: 30 };
            let isRinging = false;
            let audioCtx = null;
            let oscillators = [];
            let gainNodes = [];
            let ringInterval = null;

            // ============================================================
            // 更新时间显示
            // ============================================================
            function updateClock() {
                const now = new Date();
                const h = String(now.getHours()).padStart(2, '0');
                const m = String(now.getMinutes()).padStart(2, '0');
                const s = String(now.getSeconds()).padStart(2, '0');
                const ms = String(now.getMilliseconds()).padStart(3, '0').slice(0, 2);

                curH.textContent = h;
                curM.textContent = m;
                curS.textContent = s;
                curMs.textContent = ms;

                // 日期
                const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const week = days[now.getDay()];
                dateDisplay.textContent = `${year}年${month}月${day}日 ${week}`;

                // 检查闹钟
                if (alarmActive && !isRinging) {
                    const curHn = parseInt(h, 10);
                    const curMn = parseInt(m, 10);
                    if (curHn === alarmTime.h && curMn === alarmTime.m) {
                        // 触发闹钟（秒忽略，精确到分钟）
                        triggerAlarm();
                    }
                }
            }

            // ============================================================
            // 闹钟声音 (Web Audio)
            // ============================================================
            function playAlarmSound() {
                try {
                    if (!audioCtx) {
                        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    }

                    // 创建两个振荡器发出交替音调
                    const freq1 = 800;
                    const freq2 = 1000;

                    const osc1 = audioCtx.createOscillator();
                    const gain1 = audioCtx.createGain();
                    osc1.type = 'square';
                    osc1.frequency.value = freq1;
                    gain1.gain.value = 0.15;
                    osc1.connect(gain1);
                    gain1.connect(audioCtx.destination);

                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.type = 'square';
                    osc2.frequency.value = freq2;
                    gain2.gain.value = 0.15;
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);

                    oscillators.push(osc1, osc2);
                    gainNodes.push(gain1, gain2);

                    osc1.start();
                    osc2.start();

                    // 交替音量 (模拟铃声)
                    let toggle = true;
                    ringInterval = setInterval(() => {
                        if (!isRinging) {
                            clearInterval(ringInterval);
                            return;
                        }
                        toggle = !toggle;
                        const val = toggle ? 0.15 : 0.05;
                        gain1.gain.value = val;
                        gain2.gain.value = val * 0.8;
                    }, 300);

                    // 自动停止声音如果5分钟后仍在响 (保险)
                    setTimeout(() => {
                        if (isRinging) stopAlarmSound();
                    }, 300000);

                } catch (e) {
                    console.warn('Web Audio 不可用，使用备用提示');
                    // 备用: 使用系统蜂鸣或仅视觉
                }
            }

            function stopAlarmSound() {
                if (ringInterval) {
                    clearInterval(ringInterval);
                    ringInterval = null;
                }
                oscillators.forEach(osc => {
                    try { osc.stop(); } catch (e) {}
                });
                oscillators = [];
                gainNodes = [];
                if (audioCtx && audioCtx.state === 'running') {
                    audioCtx.suspend();
                }
            }

            // ============================================================
            // 触发闹钟
            // ============================================================
            function triggerAlarm() {
                if (isRinging) return;
                isRinging = true;
                ringingOverlay.classList.add('show');
                ringTime.textContent = `${String(alarmTime.h).padStart(2, '0')}:${String(alarmTime.m).padStart(2, '0')}`;
                statusText.textContent = '● 响铃中';
                statusText.className = 'status ringing';
                alarmStatus.textContent = '● 响铃';
                alarmStatus.style.color = 'rgba(255,80,80,0.8)';
                // 播放声音
                playAlarmSound();
                // 页面标题闪烁
                document.title = '⏰ 闹钟响铃！';
            }

            // ============================================================
            // 停止闹钟
            // ============================================================
            function stopAlarm() {
                if (!isRinging) return;
                isRinging = false;
                ringingOverlay.classList.remove('show');
                stopAlarmSound();
                statusText.textContent = '● 已停止';
                statusText.className = 'status';
                alarmStatus.textContent = '● 关闭';
                alarmStatus.style.color = '';
                document.title = '暗色闹钟';
                // 如果闹钟仍处于激活状态，保持激活，但不会再触发（除非重新设定）
                // 我们保留alarmActive为true，但已经触发过了，用户需要手动取消或重新设定
                // 建议自动取消闹钟状态，以免再次触发
                alarmActive = false;
                statusText.textContent = '● 待命';
                alarmStatus.textContent = '● 关闭';
                alarmStatus.style.color = '';
                btnSet.textContent = '🔔 设定';
                btnSet.classList.remove('active');
            }

            // ============================================================
            // 设定闹钟
            // ============================================================
            function setAlarm() {
                let h = parseInt(alarmHour.value, 10);
                let m = parseInt(alarmMinute.value, 10);
                if (isNaN(h)) h = 0;
                if (isNaN(m)) m = 0;
                h = Math.max(0, Math.min(23, h));
                m = Math.max(0, Math.min(59, m));
                alarmHour.value = h;
                alarmMinute.value = m;

                alarmTime.h = h;
                alarmTime.m = m;
                alarmActive = true;
                isRinging = false; // 重置响铃状态
                // 如果正在响铃，停止
                if (ringingOverlay.classList.contains('show')) {
                    stopAlarm();
                }
                statusText.textContent = '● 已设定';
                statusText.className = 'status active';
                alarmStatus.textContent = `● 开启 (${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')})`;
                alarmStatus.style.color = 'rgba(80,200,255,0.6)';
                btnSet.textContent = '✓ 已设定';
                btnSet.classList.add('active');
                // 清除之前的铃声残留
                stopAlarmSound();
            }

            function cancelAlarm() {
                alarmActive = false;
                isRinging = false;
                if (ringingOverlay.classList.contains('show')) {
                    stopAlarm();
                }
                stopAlarmSound();
                statusText.textContent = '● 待命';
                statusText.className = 'status';
                alarmStatus.textContent = '● 关闭';
                alarmStatus.style.color = '';
                btnSet.textContent = '🔔 设定';
                btnSet.classList.remove('active');
                document.title = '暗色闹钟';
            }

            // ============================================================
            // 事件绑定
            // ============================================================
            btnSet.addEventListener('click', setAlarm);
            btnCancel.addEventListener('click', cancelAlarm);
            btnStopRing.addEventListener('click', stopAlarm);

            // 输入框限制
            alarmHour.addEventListener('change', function() {
                let v = parseInt(this.value, 10);
                if (isNaN(v)) v = 0;
                this.value = Math.max(0, Math.min(23, v));
            });
            alarmMinute.addEventListener('change', function() {
                let v = parseInt(this.value, 10);
                if (isNaN(v)) v = 0;
                this.value = Math.max(0, Math.min(59, v));
            });

            // ============================================================
            // 初始化
            // ============================================================
            updateClock();
            setInterval(updateClock, 100);

            // 如果页面可见时恢复音频上下文
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            });

            // 键盘快捷键: Enter 设定, Escape 取消/停止
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') {
                    if (e.key === 'Enter') {
                        setAlarm();
                    }
                    return;
                }
                if (e.key === 'Escape') {
                    if (isRinging) {
                        stopAlarm();
                    } else {
                        cancelAlarm();
                    }
                }
            });

            console.log('⏰ 暗色闹钟已启动');
            console.log('⌨️ Enter: 设定闹钟  |  ESC: 取消/停止');

        })();
    </script>

</body>
</html>
